# Publish every publishable package at ITS MANIFEST VERSION to public npm under
# `next`, with provenance. Reusable; a member calls it from a workflow that
# fires ONLY on `release: [published]` — a GitHub Release the user publishes.
# That is the family's "never publish without the user's word" rule, moved from
# prose into a trigger.
#
# This is spec 04's FALLBACK shape (OIDC provenance + a user-published Release),
# taken because the staged-publish probe has not been run. When it has, `stage`
# replaces the publish step and NPM_TOKEN disappears; the verify job stays.
name: Release

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '22'
    secrets:
      NPM_TOKEN:
        required: true

# actions: read is what lets verify ask the API for this commit's snapshot run.
# An explicit permissions block grants NOTHING it does not name, and a reusable
# workflow's grants are capped by its caller's — so the caller template carries
# the same three lines. Measured: core's rerun failed verify with "Resource not
# accessible by integration (HTTP 403)" while the identical query passed from a
# laptop token.
permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      manager: ${{ steps.cfg.outputs.manager }}
      layout: ${{ steps.cfg.outputs.layout }}
      publishes: ${{ steps.cfg.outputs.publishes }}
      publicRelease: ${{ steps.cfg.outputs.publicRelease }}
    steps:
      # family-config reads the config THROUGH family-tools, so the tools must
      # be on disk first — setup-family checks out and fetches them; a bare
      # actions/checkout does not. Measured: core's first release run
      # (34245176242) failed here with "Cannot find module .family-tools/tools/cli.mjs".
      - uses: noy-db/.github/actions/setup-family@v1
        with:
          node-version: ${{ inputs.node-version }}
          install: 'false'
      - id: cfg
        uses: noy-db/.github/actions/family-config@v1

  # A repo whose family.config.json says publicRelease: false (the premium tier)
  # must never reach public npm through this workflow, whatever a stray Release
  # or a copied caller does — spec §4.2's refuse-a-public-publish gate, by
  # construction rather than by an absent secret. Loud, so it reads as a
  # deliberate refusal and not as a misconfiguration.
  refused:
    needs: config
    if: needs.config.outputs.publicRelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '::error::family.config.json declares publicRelease: false — this repo does not publish to public npm. Nothing was published.'
          exit 1

  verify:
    needs: config
    if: needs.config.outputs.publishes == 'true' && needs.config.outputs.publicRelease != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: noy-db/.github/actions/setup-family@v1
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ inputs.node-version }}

      # A public cut is never the first build of a commit.
      - name: The same commit has a green dev snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/snapshot.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [ "$n" = "0" ]; then
            echo "::error::no successful snapshot.yml run for ${GITHUB_SHA} — cut a dev snapshot first"
            exit 1
          fi

      - name: The line is uniform, and its licence ships
        run: |
          node .family-tools/tools/cli.mjs versions-uniform --root .
          node .family-tools/tools/cli.mjs check-license --root .

      # The Release's tag is the version the user chose to publish; the manifest
      # is the version that will actually go out. They must be the same string.
      - name: The Release tag equals the manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(node .family-tools/tools/cli.mjs snapshot-report --root . --version)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::release tag_name ${TAG} != manifest version ${version}"
            exit 1
          fi

      - name: CHANGELOG has a section for this version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          v="${TAG#v}"
          if ! grep -rqE "^## +\[?${v//./\\.}\]?" --include=CHANGELOG.md .; then
            echo "::error::no CHANGELOG.md section titled ${v}"
            exit 1
          fi
          # ⛔ AND IT MUST NOT BE EMPTY. as#5 merged a public option on two packages with
          # an empty "## Unreleased"; the section would have existed at cut time with
          # nothing in it, and the notes a consumer reads would not have mentioned the
          # option. A heading is a promise; the bullets are the notes. Measured
          # 2026-09-15: as 4 source commits / 0 bullets, at 2 / 0.
          empty=0
          for f in $(git ls-files '*CHANGELOG.md'); do
            body=$(awk -v h="^## +\\[?${v//./\\.}\\]?" '$0 ~ h {f=1; next} /^## /{f=0} f' "$f" | grep -cE '^\s*[-*]' || true)
            if grep -qE "^## +\[?${v//./\\.}\]?" "$f" && [ "$body" = "0" ]; then
              echo "::error::${f}: the ${v} section has no bullet — a heading with no notes"
              empty=1
            fi
          done
          [ "$empty" = "0" ]

  # ⛔ A CHECK THAT IS NOT IN THE RELEASE PATH CANNOT GATE A RELEASE. This lived
  # only as a Monday-06:00 cron in each caller, so when 0.8.0 shipped, THREE
  # repos published to @latest with their peer-floor claim unverified against the
  # code being released — `to` had been red for a week and `at`/`on` had last run
  # against a pre-0.8 base. It did not fail; it was not asked.
  #
  # ⭐ Here and not in `family.config.json`'s gates array, deliberately: the gates
  # array runs on every PR, and this installs published versions from the network
  # and rewrites the tree to do it. The property only has to hold at the instant a
  # version is published. Same argument that put the census in this file.
  #
  # ⚠️ Its own job, not a step in `verify`: the floor install MUTATES the tree, so
  # it needs `frozen: false` — which is exactly what verify must not have.
  peer-floor:
    needs: config
    if: needs.config.outputs.publishes == 'true' && needs.config.outputs.publicRelease != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: noy-db/.github/actions/setup-family@v1
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ inputs.node-version }}
          frozen: 'false'
      - name: Build
        run: ${{ needs.config.outputs.manager }} run --if-present build
      - name: Every package compiles against the oldest version its peers admit
        run: node .family-tools/tools/cli.mjs peer-floor --root .

  publish:
    needs: [config, verify, peer-floor]
    if: needs.config.outputs.publicRelease != 'false'
    runs-on: ubuntu-latest
    # ⭐ THE GATE. `release` carries a required reviewer, so the publish job
    # PAUSES here until a human approves it in the GitHub UI — the family's
    # "never publish without explicit user confirmation" rule as an enforced
    # gate rather than a line of prose.
    #
    # ⛔ The rule lives in repository SETTINGS, which a silo cannot reach — unlike
    # `family.config.json`, which a silo can edit in its own PR. That is the whole
    # reason the boundary sits here. Set with `_family/scripts/rail.mjs gate`.
    #
    # ⚠️ NPM_TOKEN is an ORG secret scoped to the six public publishers, no longer
    # six repo copies. It is still reached through `secrets: inherit` in the caller.
    environment: release
    env:
      MANAGER: ${{ needs.config.outputs.manager }}
      LAYOUT: ${{ needs.config.outputs.layout }}
    steps:
      - uses: noy-db/.github/actions/setup-family@v1
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ inputs.node-version }}
      - name: Build
        run: ${{ needs.config.outputs.manager }} run --if-present build
      # Flat repos do not carry @changesets/cli as a devDependency (core does);
      # `npx --no-install changeset` then fails with "could not determine
      # executable to run". Same step as snapshot.yml — lifted verbatim.
      # Measured: to's first release run, 2026-09-11, publish job, 0 of 18.
      - name: Ensure @changesets/cli
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').devDependencies?.['@changesets/cli']?0:1)"; then
            echo '@changesets/cli is already a devDependency'
          elif [ "$MANAGER" = 'pnpm' ] && [ "$LAYOUT" != 'single' ]; then
            pnpm add -w -D @changesets/cli@2
          elif [ "$MANAGER" = 'pnpm' ]; then
            pnpm add -D @changesets/cli@2
          else
            npm install --no-save --no-audit --no-fund @changesets/cli@2
          fi

      # The token is expanded by npm from the environment at request time, so
      # the file itself carries the variable name and never the secret.
      - name: Authenticate to public npm
        run: printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' >> ~/.npmrc
      # No provenance: npm's sigstore check requires a PUBLIC source repository
      # (E422 "Unsupported GitHub Actions source repository visibility: private",
      # measured on core 2026-09-10, 0 of 34 published). The member repos are
      # private by ruling (D3). Re-add npm's provenance env flag only when a
      # repo is public — the id-token grant stays so that flip is one line.
      - name: Publish @ next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx --no-install changeset publish --tag next --no-git-tag
      # Runs even when publish fails: a partial publish (to, 2026-09-11: 11 of 18
      # on npm E409 while changesets reported 0) must still leave a record. The
      # absence of a summary renders identically to "nothing happened".
      - name: Record
        if: always()
        run: |
          {
            echo '### Published @ next'
            echo '```'
            node .family-tools/tools/cli.mjs snapshot-report --root .
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⛔ THE CENSUS. Asks the REGISTRY whether it gained every version the
      # publisher claimed — the one question nothing else in this rail asks.
      #
      # core's v0.8.0 run, 2026-09-13: green, 34 of 36 published. changesets
      # printed `🦋 @noy-db/hub@0.8.0` in its success list and npm never gained
      # the version. No error, exit 0. `hub` is the trust boundary every
      # satellite binds.
      #
      # ⚠️ `if: always()` on purpose: a partial publish is EXACTLY the case where
      # the publish step may have failed, and that is when the count matters
      # most. Skipping the census on failure would hide the shape of the damage.
      #
      # ⭐ Placed AFTER Record so the summary survives even when this fails the
      # job — an operator needs the list of what did publish in order to decide
      # whether to re-fire the Release.
      - name: Census — every published version must resolve on the registry
        if: always()
        run: node .family-tools/tools/cli.mjs publish-census --root .
