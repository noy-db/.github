# Delete old `0.0.0-dev-<YYYYMMDDHHmmss>` versions from the org's GitHub Packages npm
# registry, keeping the newest `keep` per package.
#
# With the caller's GITHUB_TOKEN this can only see the packages the CALLING repo
# owns. That is the intended scope: each publishing repo prunes its own, weekly.
name: Prune snapshots

on:
  workflow_call:
    inputs:
      keep:
        description: How many dev versions to keep per package.
        type: number
        required: false
        default: 20
      dry-run:
        description: List what would be deleted without deleting it.
        type: boolean
        required: false
        default: false

permissions:
  packages: write

jobs:
  prune:
    name: prune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          KEEP: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            // Only a version whose NAME matches this is ever a deletion
            // candidate, and the check is repeated immediately before the
            // DELETE. Two reads of the same regex is cheap; deleting a real
            // release from the registry is not undoable.
            const DEV = /^0\.0\.0-dev-/
            const keep = Number(process.env.KEEP)
            const dryRun = process.env.DRY_RUN === 'true'
            if (!Number.isInteger(keep) || keep < 0) throw new Error(`keep must be a non-negative integer, got ${process.env.KEEP}`)

            const org = context.repo.owner
            const repo = context.repo.repo

            // May 403 under a repo-scoped GITHUB_TOKEN — that means a PAT is
            // needed, not that there is nothing to prune. Do not "handle" the
            // 403 into an empty list.
            const packages = await github.paginate('GET /orgs/{org}/packages', {
              org,
              package_type: 'npm',
              per_page: 100,
            })

            // For an npm package in an org registry the API's `package_name` is
            // the UNSCOPED name (`hub`, not `@noy-db/hub`) — the scope is the
            // org and is carried by the `org` path parameter. It therefore
            // contains no `/`; octokit percent-encodes path parameters anyway,
            // so the name is passed through as-is rather than pre-encoded.
            let deleted = 0
            const lines = []
            for (const pkg of packages) {
              // A token issued to this repo can only act on this repo's
              // packages; skipping the rest keeps the log honest about scope.
              if (pkg.repository && pkg.repository.name !== repo) continue

              const versions = await github.paginate(
                'GET /orgs/{org}/packages/{package_type}/{package_name}/versions',
                { org, package_type: 'npm', package_name: pkg.name, per_page: 100 },
              )
              const dev = versions
                .filter((v) => DEV.test(v.name))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              const doomed = dev.slice(keep)
              lines.push(`${pkg.name}: ${versions.length} versions, ${dev.length} dev, ${doomed.length} to delete`)

              for (const v of doomed) {
                if (!DEV.test(v.name)) throw new Error(`refusing to delete ${pkg.name}@${v.name}: not a dev snapshot`)
                if (dryRun) {
                  lines.push(`  would delete ${pkg.name}@${v.name}`)
                  continue
                }
                await github.request(
                  'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  { org, package_type: 'npm', package_name: pkg.name, package_version_id: v.id },
                )
                deleted++
                lines.push(`  deleted ${pkg.name}@${v.name}`)
              }
            }

            core.summary
              .addHeading(dryRun ? 'Prune snapshots (dry run)' : 'Prune snapshots', 3)
              .addRaw(`keep=${keep}, scope ${org}/${repo}\n`)
              .addCodeBlock(lines.join('\n') || '(nothing)')
            await core.summary.write()
            core.info(`deleted ${deleted} version(s)`)
