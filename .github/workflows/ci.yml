# The family CI. A member repo's own .github/workflows/ci.yml is three lines:
#
#   jobs:
#     ci:
#       uses: noy-db/.github/.github/workflows/ci.yml@v2
#       secrets: inherit
#
# Everything this workflow runs is decided by the caller's family.config.json.
# No job here may be made soft (the flag that lets a failed step pass): a gate
# that cannot fail the build is not a gate, and the self-test greps this file
# for that flag by name.
name: CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node major for the non-matrix jobs.
        type: string
        required: false
        default: '22'
      node-matrix:
        # ⭐ Trimmed to a single major on every push 2026-09-13, when publishing
        # froze and `@dev` became the family's only release surface. With one
        # developer and one consumer on one runtime, a second major on every
        # push bought a signal nobody was reading at twice the wall-clock.
        # ⛔ It is a TRIM, not a deletion: `templates/nightly-caller.yml` passes
        # the full matrix on a schedule, and a repo without that caller has
        # genuinely stopped testing node 24. Adopt the caller or say so out loud.
        # ⚠️ Do NOT narrow this to match whatever the current consumer runs. The
        # published packages carry no engines floor promise that one runtime can
        # discharge, and the nightly is what keeps that honest.
        description: JSON array of Node majors for the test matrix.
        type: string
        required: false
        default: '["22"]'

# Each job re-runs setup-family and the build. There is no artifact passing
# between them on purpose: a rebuild costs a cached install, and an artifact
# round-trip is one more thing that can be stale and green.
jobs:
  config:
    name: config
    runs-on: ubuntu-latest
    outputs:
      layout: ${{ steps.cfg.outputs.layout }}
      manager: ${{ steps.cfg.outputs.manager }}
      publishes: ${{ steps.cfg.outputs.publishes }}
      gates: ${{ steps.cfg.outputs.gates }}
      localChecks: ${{ steps.cfg.outputs.localChecks }}
      scriptTest: ${{ steps.cfg.outputs.scriptTest }}
      scriptLint: ${{ steps.cfg.outputs.scriptLint }}
      scriptTypecheck: ${{ steps.cfg.outputs.scriptTypecheck }}
    steps:
      - uses: noy-db/.github/actions/setup-family@v2
        with:
          node-version: ${{ inputs.node-version }}
          install: 'false'
      - id: cfg
        uses: noy-db/.github/actions/family-config@v2

  build:
    name: build
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: noy-db/.github/actions/setup-family@v2
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ inputs.node-version }}
      # `build` alone stays --if-present: noy-db-docs defines none. The three
      # scripts below (test, lint, typecheck) are REQUIRED — see the test job.
      - name: Build
        run: ${{ needs.config.outputs.manager }} run --if-present build

  test:
    name: test (node ${{ matrix.node }})
    needs: [config, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-matrix) }}
    steps:
      - uses: noy-db/.github/actions/setup-family@v2
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ matrix.node }}
      - name: Build
        run: ${{ needs.config.outputs.manager }} run --if-present build
      # ⛔ No --if-present on test, lint or typecheck (family#142). With it, a
      # renamed or deleted script turned the job green with nothing run. A repo
      # without one of the three declares `"scripts": { "<name>": false }` in
      # its family.config.json and the step is skipped; the opt-out is a
      # declaration in the member's own tree, where a reviewer can see it.
      # The guard is `!= 'false'`, never `== 'true'`: an unset output is '' (and
      # a tools checkout older than this key prints `null`), and both must mean
      # REQUIRED — only an explicit false in the member's tree skips a step.
      - name: Test
        if: needs.config.outputs.scriptTest != 'false'
        run: ${{ needs.config.outputs.manager }} run test

  gates:
    name: gate ${{ matrix.gate }}
    needs: [config, build]
    if: needs.config.outputs.gates != '[]'
    runs-on: ubuntu-latest
    strategy:
      # Every gate reports independently: one red gate must not hide the state
      # of the others, which is the whole reason they are separate jobs.
      fail-fast: false
      matrix:
        gate: ${{ fromJSON(needs.config.outputs.gates) }}
    steps:
      - uses: noy-db/.github/actions/setup-family@v2
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ inputs.node-version }}
      # codemod-rows reads its maps from the INSTALLED @noy-db/hub; the build
      # is what makes a workspace's own dist resolvable to the source walk.
      - name: Build
        run: ${{ needs.config.outputs.manager }} run --if-present build
      - name: Run the gate
        run: node .family-tools/tools/cli.mjs ${{ matrix.gate }} --root .

  local-checks:
    name: local checks
    needs: [config, build]
    if: needs.config.outputs.localChecks != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: noy-db/.github/actions/setup-family@v2
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ inputs.node-version }}
      - name: Build
        run: ${{ needs.config.outputs.manager }} run --if-present build
      - name: Run the repo's own checks
        # The command list arrives through the environment, never interpolated
        # into the script text: a config value must be data here, not shell.
        env:
          CHECKS: ${{ needs.config.outputs.localChecks }}
        run: |
          set -euo pipefail
          mapfile -t cmds < <(jq -r '.[]' <<<"$CHECKS")
          for cmd in "${cmds[@]}"; do
            echo "::group::$cmd"
            bash -c "$cmd"
            echo "::endgroup::"
          done

  lint-typecheck:
    name: lint & typecheck
    needs: [config, build]
    runs-on: ubuntu-latest
    steps:
      - uses: noy-db/.github/actions/setup-family@v2
        with:
          manager: ${{ needs.config.outputs.manager }}
          node-version: ${{ inputs.node-version }}
      - name: Build
        run: ${{ needs.config.outputs.manager }} run --if-present build
      # Required unless declared off in family.config.json — see the test job.
      - name: Lint
        if: needs.config.outputs.scriptLint != 'false'
        run: ${{ needs.config.outputs.manager }} run lint
      - name: Typecheck
        if: needs.config.outputs.scriptTypecheck != 'false'
        run: ${{ needs.config.outputs.manager }} run typecheck
