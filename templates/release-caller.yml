# templates/release-caller.yml — copy to <member>/.github/workflows/release.yml
# Fires ONLY when a human publishes a GitHub Release. The tag IS the version.
name: Release
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
  actions: read   # verify reads this commit's snapshot run; without it: HTTP 403
jobs:
  release:
    uses: noy-db/.github/.github/workflows/release.yml@v1
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
